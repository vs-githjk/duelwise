name = "duelwise-relay"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://duelwise.app,https://www.duelwise.app"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "LimiterDO"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "BudgetDO"

# SQLite-backed Durable Objects: the only kind the Workers Free plan allows.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO", "LimiterDO"]

# DUEL_SIGNING_SECRET is a secret: `wrangler secret put DUEL_SIGNING_SECRET`, never written here.

# v2 (slice 2): the realtime budget counter. A new class only; RoomDO and LimiterDO are untouched.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["BudgetDO"]
